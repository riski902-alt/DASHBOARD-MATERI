<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Informatika</title>
    
    <!-- Memanggil file CSS dan Keamanan Login kita -->
    <link rel="stylesheet" href="style.css">
    <script src="cek-login.js"></script>
</head>
<body>
    
    <!-- WADAH UTAMA HALAMAN -->
    <div id="dashboard-container">
        
        <!-- BAGIAN KEPALA (Menampilkan Judul Bab dan Pertemuan) -->
        <div class="page-title-section">
            <div class="page-title-content">
                <!-- Ruang Kosong 1: Untuk Judul Bab -->
                <h1 id="tempat-judul-bab" class="chapter-title">Memuat Bab...</h1>
                
                <!-- Ruang Kosong 2: Untuk Judul Pertemuan -->
                <h2 id="tempat-judul-pertemuan" class="meeting-title">Memuat Pertemuan...</h2>
            </div>
        </div>

        <!-- BAGIAN ISI MATERI -->
        <div class="main-content-area">
            <div class="content-card">
                <!-- Ruang Kosong 3: Untuk Isi Materi (ATP, Eksplorasi Konsep, dll) -->
                <div id="tempat-isi-materi" class="materi-content">
                    <p>Sedang mengambil data materi, mohon tunggu sebentar...</p>
                </div>
            </div>
            
            <!-- Tombol untuk kembali ke Dashboard Utama -->
            <button onclick="window.location.href='index.html'" class="btn-action">Kembali ke Menu Utama</button>
        </div>

    </div>

    <!-- SCRIPT UNTUK MERAKIT DATA DARI JSON -->
    <script>
        // 1. Mengambil informasi dari Link (URL)
        // Contoh URL nanti: baca-materi.html?id=kelas7-bab1-pertemuan1&menu=atp
        const urlParams = new URLSearchParams(window.location.search);
        const idPertemuan = urlParams.get('id');   // Hasilnya: kelas7-bab1-pertemuan1
        const idMenu = urlParams.get('menu');      // Hasilnya: atp

        // 2. Fungsi Utama untuk Mengambil dan Menempelkan Data
        async function tampilkanMateri() {
            try {
                // Membuka file materi.json
                const respon = await fetch('materi.json');
                const dataMaster = await respon.json();

                // Mengecek apakah data pertemuannya ada di dalam JSON
                if (dataMaster[idPertemuan]) {
                    const dataPilihan = dataMaster[idPertemuan];

                    // Menempelkan data ke Ruang Kosong di HTML (Judul Bab & Pertemuan)
                    document.getElementById('tempat-judul-bab').innerText = dataPilihan.judul_bab;
                    document.getElementById('tempat-judul-pertemuan').innerText = dataPilihan.judul_pertemuan;

                    // Mengecek apakah isi materi untuk menu tersebut tersedia
                    if (dataPilihan.konten[idMenu]) {
                        
                        // ========================================================
                        // LOGIKA REDESAIN KHUSUS MENU ATP
                        // ========================================================
                        if (idMenu === 'atp') {
                            const rawHTML = dataPilihan.konten[idMenu];
                            
                            // A. Buat Header
                            const headerHTML = `
                                <div class="atp-header">
                                    <i class="ph-duotone ph-rocket-launch atp-header-icon"></i>
                                    <div class="atp-header-text">
                                        <h2>ALUR TUJUAN PEMBELAJARAN</h2>
                                        <p>Ini adalah peta petualangan belajarmu. Mari kita capai targetnya bersama-sama!</p>
                                    </div>
                                    <i class="ph-duotone ph-compass atp-header-deco"></i>
                                </div>
                            `;

                            // B. Parsing (Membongkar) Teks JSON untuk dijadikan Kartu Bento Grid
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = rawHTML;
                            let bentoCards = '<div class="atp-bento">';
                            let currentTitle = '';
                            let cardTheme = { icon: 'ph-target', color: 'var(--denim-blue)' };

                            Array.from(tempDiv.children).forEach(el => {
                                if (el.tagName === 'H3') {
                                    currentTitle = el.innerText.replace(':', '').trim();
                                    // Menentukan ikon dan warna berdasarkan judul otomatis
                                    if (currentTitle.toLowerCase().includes('elemen')) { 
                                        cardTheme = { icon: 'ph-puzzle-piece', color: 'var(--cyan-accent)' }; 
                                    } else if (currentTitle.toLowerCase().includes('capaian')) { 
                                        cardTheme = { icon: 'ph-flag-checkered', color: 'var(--status-green)' }; 
                                    } else if (currentTitle.toLowerCase().includes('tujuan')) { 
                                        cardTheme = { icon: 'ph-crosshair', color: '#f59e0b' }; // Amber
                                    } else if (currentTitle.toLowerCase().includes('topik')) { 
                                        cardTheme = { icon: 'ph-book-open-text', color: 'var(--deep-navy)' }; 
                                    } else {
                                        cardTheme = { icon: 'ph-star', color: 'var(--soft-denim)' };
                                    }
                                } else if (el.tagName === 'P') {
                                    if(el.innerText.trim() !== "") {
                                        bentoCards += `
                                            <div class="atp-card">
                                                <div class="atp-card-icon-wrapper" style="background: ${cardTheme.color}20; color: ${cardTheme.color};">
                                                    <i class="ph-duotone ${cardTheme.icon}"></i>
                                                </div>
                                                <h4 style="color: ${cardTheme.color}">${currentTitle}</h4>
                                                <p>${el.innerHTML}</p>
                                            </div>
                                        `;
                                    }
                                }
                            });
                            bentoCards += '</div>';

                            // C. Visualisasi Perjalanan Belajar
                            const journeyHTML = `
                                <div class="atp-journey">
                                    <h3>Visualisasi Perjalanan Belajarmu</h3>
                                    <div class="atp-journey-steps">
                                        <div class="atp-journey-line"></div>
                                        <div class="atp-step"><div class="atp-step-icon"><i class="ph-bold ph-target"></i></div><span>Pahami Tujuan</span></div>
                                        <div class="atp-step"><div class="atp-step-icon"><i class="ph-bold ph-book-open"></i></div><span>Ikuti Pembelajaran</span></div>
                                        <div class="atp-step"><div class="atp-step-icon"><i class="ph-bold ph-wrench"></i></div><span>Praktikkan Trik</span></div>
                                        <div class="atp-step"><div class="atp-step-icon"><i class="ph-bold ph-brain"></i></div><span>Refleksikan Hasil</span></div>
                                    </div>
                                </div>
                            `;

                            // D. Panel Motivasi
                            const motivationHTML = `
                                <div class="atp-motivation">
                                    <i class="ph-duotone ph-sparkle"></i>
                                    <div>
                                        <h4>Siap Memulai Petualangan Informatika?</h4>
                                        <p>Petualangan seru menantimu. Pastikan kamu sudah membaca peta di atas ya!</p>
                                    </div>
                                </div>
                            `;

                            // Menggabungkan semua dan menempelkannya ke layar
                            document.getElementById('tempat-isi-materi').innerHTML = `<div class="atp-wrapper">${headerHTML}${bentoCards}${journeyHTML}${motivationHTML}</div>`;
                            
                        } else {
                            // ========================================================
                            // JIKA BUKAN MENU ATP, TAMPILKAN SECARA NORMAL (TIDAK ADA YANG BERUBAH)
                            // ========================================================
                            document.getElementById('tempat-isi-materi').innerHTML = dataPilihan.konten[idMenu];
                        }
                    } else {
                        document.getElementById('tempat-isi-materi').innerHTML = "<p>Maaf, materi untuk bagian ini belum diisi.</p>";
                    }
                } else {
                    document.getElementById('tempat-judul-bab').innerText = "Data Tidak Ditemukan";
                    document.getElementById('tempat-judul-pertemuan').innerText = "Pastikan link URL sudah benar.";
                }
            } catch (error) {
                console.error("Gagal mengambil materi:", error);
                document.getElementById('tempat-isi-materi').innerHTML = "<p>Terjadi kesalahan saat memuat materi.</p>";
            }
        }

                    // 3. Menempelkan data ke Ruang Kosong di HTML
                    document.getElementById('tempat-judul-bab').innerText = dataPilihan.judul_bab;
                    document.getElementById('tempat-judul-pertemuan').innerText = dataPilihan.judul_pertemuan;

                    // Mengecek apakah isi materi untuk menu tersebut (misal: atp) tersedia
                    if (dataPilihan.konten[idMenu]) {
                        // Menempelkan isi materi (Tujuan & Alur Pembelajaran)
                        document.getElementById('tempat-isi-materi').innerHTML = dataPilihan.konten[idMenu];
                    } else {
                        document.getElementById('tempat-isi-materi').innerHTML = "<p>Maaf, materi untuk bagian ini belum diisi.</p>";
                    }
                } else {
                    document.getElementById('tempat-judul-bab').innerText = "Data Tidak Ditemukan";
                    document.getElementById('tempat-judul-pertemuan').innerText = "Pastikan link URL sudah benar.";
                }
            } catch (error) {
                console.error("Gagal mengambil materi:", error);
                document.getElementById('tempat-isi-materi').innerHTML = "<p>Terjadi kesalahan saat memuat materi.</p>";
            }
        }

        // 4. Jalankan fungsinya saat halaman dibuka
        tampilkanMateri();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Informatika</title>
    
    <!-- Memanggil file CSS dan Keamanan Login -->
    <link rel="stylesheet" href="style.css">
    <script src="cek-login.js"></script>
    <!-- Script komponen ATP -->
    <script src="komponen-atp.js"></script>
</head>
<body>
    
    <!-- WADAH UTAMA HALAMAN -->
    <div id="dashboard-container">
        
        <!-- BAGIAN KEPALA -->
        <div class="page-title-section">
            <div class="page-title-content">
                <h1 id="tempat-judul-bab" class="chapter-title">Memuat Bab...</h1>
                <h2 id="tempat-judul-pertemuan" class="meeting-title">Memuat Pertemuan...</h2>
            </div>
        </div>

        <!-- BAGIAN ISI MATERI -->
        <div class="main-content-area">
            <div class="content-card">
                <div id="tempat-isi-materi" class="materi-content">
                    <p>Sedang mengambil data materi, mohon tunggu sebentar...</p>
                </div>
            </div>
            
            <button onclick="window.location.href='index.html'" class="btn-action" style="background-color: #dc3545; color: white; margin-top: 20px; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
                Kembali ke Menu Utama
            </button>
        </div>

    </div>

    <!-- SCRIPT MERAKIT DATA DARI JSON -->
    <!-- SCRIPT MERAKIT DATA DARI JSON -->
    <script>
        // 1. Mengambil parameter 'id' dan 'menu' dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const idPertemuan = urlParams.get('id');
        const idMenu = urlParams.get('menu');

        async function tampilkanMateri() {
            try {
                // Membaca file data materi.json
                const respon = await fetch('materi.json');
                const dataMaster = await respon.json();

                // 2. Mengecek apakah ID Pertemuan ada di materi.json
                if (idPertemuan && dataMaster[idPertemuan]) {
                    const dataPilihan = dataMaster[idPertemuan];

                    // Mengisi Judul Bab & Pertemuan
                    document.getElementById('tempat-judul-bab').innerText = dataPilihan.judul_bab;
                    document.getElementById('tempat-judul-pertemuan').innerText = dataPilihan.judul_pertemuan;

                    const wadahIsiMateri = document.getElementById('tempat-isi-materi');
                    wadahIsiMateri.innerHTML = ''; // Mengosongkan status memuat

                    const semuaKonten = dataPilihan.konten;

                    // Fungsi bantuan untuk menampilkan konten (teks vs iframe)
                    function renderKonten(isi) {
                        // Jika isi berupa link file .html, gunakan iframe agar halamannya terbuka di dalam
                        if (isi.includes('.html')) {
                            return `<iframe src="${isi}" width="100%" height="600px" style="border: none; border-radius: 8px;"></iframe>`;
                        }
                        // Jika isi berupa teks biasa / tag HTML, tampilkan apa adanya
                        return isi;
                    }

                    // 3. LOGIKA CERDAS A: Jika parameter 'menu' spesifik ada di URL
                    if (idMenu && semuaKonten[idMenu]) {
                        let isiMenu = semuaKonten[idMenu];
                        
                        if (idMenu === 'atp' && typeof buatDesainATP === 'function') {
                            wadahIsiMateri.innerHTML = buatDesainATP(isiMenu);
                        } else {
                            wadahIsiMateri.innerHTML = renderKonten(isiMenu);
                        }
                    } 
                    // 4. LOGIKA CERDAS B: Jika 'menu' TIDAK ADA di URL, tampilkan SEMUA menu otomatis!
                    else {
                        for (let namaMenu in semuaKonten) {
                            let isiMenu = semuaKonten[namaMenu];
                            
                            if (namaMenu === 'atp' && typeof buatDesainATP === 'function') {
                                isiMenu = buatDesainATP(isiMenu);
                            } else {
                                isiMenu = renderKonten(isiMenu);
                            }
                            
                            let divBagian = document.createElement('div');
                            divBagian.style.marginBottom = "30px";
                            let judulBagian = namaMenu.toUpperCase().replace(/-/g, ' ');
                            
                            divBagian.innerHTML = `
                                <h3 class="section-title" style="color: #1a73e8; margin-bottom: 12px; font-weight: 700;">
                                    📌 ${judulBagian}
                                </h3>
                                <div class="${namaMenu}-wrapper" style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
                                    ${isiMenu}
                                </div>
                            `;
                            
                            wadahIsiMateri.appendChild(divBagian);
                        }
                    }

                } else {
                    document.getElementById('tempat-judul-bab').innerText = "Data Tidak Ditemukan";
                    document.getElementById('tempat-judul-pertemuan').innerText = "Mohon periksa kembali link URL Anda.";
                    document.getElementById('tempat-isi-materi').innerHTML = "<p style='color: red;'>Materi tidak dapat dimuat karena ID tidak valid.</p>";
                }
            } catch (error) {
                console.error("Gagal mengambil materi:", error);
                document.getElementById('tempat-isi-materi').innerHTML = "<p style='color: red;'>Terjadi kesalahan saat mengambil data dari materi.json.</p>";
            }
        }

        // Jalankan fungsi saat halaman dimuat
        tampilkanMateri();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - INFORMATIKA FUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F1F5F9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #173B57;
            margin: 0;
        }
        .btn-logout {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #E2E8F0;
        }
        th {
            background-color: #527F9B;
            color: white;
        }
        tr:hover {
            background-color: #F8FAFC;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rekap Nilai Siswa</h1>
            <button id="btnLogout" class="btn-logout">Keluar</button>
        </div>

        <p>Selamat datang, Guru! Berikut adalah data rekapitulasi poin siswa secara real-time dari Firebase.</p>

        <table id="tabelNilai">
            <thead>
                <tr>
                    <th>Nama Siswa</th>
                    <th>NISN</th>
                    <th>Materi / Pertemuan</th>
                    <th>Poin</th>
                </tr>
            </thead>
            <tbody id="dataSiswa">
                <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Proteksi Halaman: Cek apakah yang login benar-benar Guru
        if (sessionStorage.getItem("userRole") !== "guru") {
            alert("Akses ditolak! Anda bukan admin.");
            window.location.href = "index.html"; // Arahkan kembali ke halaman login
        }

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB7bt1JBOXkh81nYk8sVkuFpSmuJ3kOj94",
            authDomain: "databasemateriinformatika.firebaseapp.com",
            projectId: "databasemateriinformatika",
            storageBucket: "databasemateriinformatika.firebasestorage.app",
            messagingSenderId: "961327810612",
            appId: "1:961327810612:web:48e952f20159a5b932e261",
            measurementId: "G-TDZQZ9L36B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Fungsi Logout
        document.getElementById("btnLogout").addEventListener("click", () => {
            signOut(auth).then(() => {
                sessionStorage.clear();
                window.location.href = "index.html"; // Sesuaikan dengan nama file login Anda
            });
        });

        // Menarik data nilai dari koleksi "hasil_asesmen" (Sesuaikan nama koleksi jika berbeda)
        async function muatDataSiswa() {
            const tabelBody = document.getElementById("dataSiswa");
            try {
                // Asumsi: Anda menyimpan jawaban di koleksi "hasil_asesmen"
                const querySnapshot = await getDocs(collection(db, "hasil_asesmen")); 
                tabelBody.innerHTML = ""; // Bersihkan teks "Memuat data..."

                if (querySnapshot.empty) {
                    tabelBody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Belum ada data ujian siswa.</td></tr>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const baris = `
                        <tr>
                            <td>${data.nama || "-"}</td>
                            <td>${data.nisn || "-"}</td>
                            <td>${data.pertemuan || "-"}</td>
                            <td><strong>${data.poin || "0"}</strong></td>
                        </tr>
                    `;
                    tabelBody.innerHTML += baris;
                });
            } catch (error) {
                console.error("Gagal memuat data: ", error);
                tabelBody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>Gagal memuat data dari database.</td></tr>";
            }
        }

        // Panggil fungsi saat halaman dimuat
        muatDataSiswa();
    </script>
</body>
</html>

    <style>
        :root {
            --bg-main: #4A7298;        
            --box-bg: #1E3A5F;         
            --box-border: #88D4AB;     
            --box-hover: #23436b;      
            --text-main: #ffffff;      
            --soft-gold: #D8BD7B;
            --muted-blue-gray: #B5C2D0;
            --soft-green: #88D4AB;
            --status-red: #E57373;
            --font-title: 'Space Grotesk', sans-serif;
            --font-nav: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; padding-bottom: 50px; overflow-x: hidden; }

        /* HEADER & PROGRES */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: var(--box-bg); border-bottom: 3px solid var(--box-border); }
        .brand { font-family: var(--font-title); font-weight: 700; color: var(--soft-green); font-size: 1.4rem; display: flex; align-items: center; gap: 16px; }
        .brand-logo { height: 48px; width: 48px; object-fit: contain; }
        .user-profile { font-family: var(--font-nav); font-size: 0.9rem; color: var(--soft-gold); display: flex; align-items: center; gap: 8px;}

        /* TOMBOL LOGOUT */
        .logout-btn {
            background-color: transparent;
            color: var(--status-red);
            border: 1px solid var(--status-red);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--font-nav);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 8px;
            display: none;
        }
        .logout-btn:hover { background-color: var(--status-red); color: var(--text-main); }

        .header-section { padding: 30px 5% 10px 5%; display: flex; flex-direction: column; gap: 15px; }
        .title-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 10px 20px; }
        .title-header-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .page-title { font-family: var(--font-title); font-size: 1.8rem; margin-bottom: 0; flex: 1; line-height: 1.2; }
        .jp-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ffffff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); }
        
        .meeting-info { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .meeting-badge { display: inline-block; background-color: var(--soft-gold); color: var(--box-bg); padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); width: fit-content; }
        .meeting-desc { font-size: 0.95rem; color: var(--muted-blue-gray); margin: 0; }
        
        .progress-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 12px; padding: 8px 15px; }
        .progress-title { display: block; font-family: var(--font-title); font-size: 0.7rem; color: var(--soft-gold); font-weight: bold; margin-bottom: 2px; }
        .progress-stats { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 5px; font-family: var(--font-nav); }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; }
        .progress-bar-fill { height: 100%; background: var(--soft-green); width: 0%; transition: width 0.5s ease; }

        /* NAVIGASI */
        .nav-wrapper { padding: 0 5%; margin-top: 15px; }
        .nav-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding-bottom: 15px; }
        .nav-container::-webkit-scrollbar { height: 6px; }
        .nav-container::-webkit-scrollbar-thumb { background: var(--soft-green); border-radius: 10px; }
        
        .nav-btn { flex: 1; min-width: 180px; background-color: var(--box-bg); color: var(--text-main); border: 2px solid var(--box-border); padding: 12px 10px; border-radius: 30px; font-family: var(--font-nav); font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .nav-btn.active { background-color: var(--box-hover); border-color: #ffffff; }
        .nav-btn.active i { color: var(--soft-green); }
        .nav-btn.locked { background-color: rgba(30, 58, 95, 0.5); border-color: rgba(136, 212, 171, 0.2); color: rgba(255,255,255,0.4); cursor: not-allowed; }
        .nav-btn.completed { background-color: var(--soft-green); color: var(--box-bg); border-color: var(--soft-green); }
        .nav-btn.completed i { color: var(--box-bg); }

        /* KONTEN (TABS) */
        .content-area { padding: 20px 5% 30px 5%; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .bento-card { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 30px; }
        .card-icon-wrapper { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background-color: rgba(136, 212, 171, 0.15); color: var(--soft-green); font-size: 26px; margin-bottom: 15px; }
        .bento-card.highlight { background-color: var(--soft-green); border-color: var(--text-main); color: var(--box-bg); }
        .bento-title { font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 12px; font-weight: 700; }

        /* TOMBOL AKSI */
        .action-button { align-self: flex-end; background-color: var(--soft-gold); color: var(--box-bg); border: none; padding: 12px 30px; border-radius: 8px; font-family: var(--font-nav); font-size: 1rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .action-button:disabled { background-color: #3b5a7a; color: #8bb3d4; cursor: not-allowed; }
    </style>
</head>
<body>

	<!-- Pastikan tag script menggunakan type="module" -->
<script type="module">
    // 1. MENGIMPOR KOMPONEN
    // Kita memanggil ke-7 fungsi yang sudah kamu buat di file komponen-menu.js
    import { 
        buatKomponenATP, 
        buatKomponenAsesmenAwal, 
        buatKomponenPertanyaanEsensial,
        buatKomponenEksplorasiKonsep,
        buatKomponenForLearning,
        buatKomponenPenerapanKonsep,
        buatKomponenAsLearning
    } from './komponen-menu.js';
<!-- KODE PENGGANTI UNTUK TOMBOL LAMA (KOTAK MERAH) -->
<nav class="learning-menu-container">
    <button class="menu-btn locked" data-menu="atp" id="btn-atp" disabled>
        <div class="menu-icon"><i class="ph ph-list-checks"></i></div>
        <span class="menu-text">ATP</span>

    </button>

    <button class="menu-btn locked" data-menu="asesmen-awal" id="btn-asesmen-awal" disabled>
        <div class="menu-icon"><i class="ph ph-clipboard-text"></i></div>
        <span class="menu-text">Asesmen Awal</span>
        <div class="menu-status"><i class="ph ph-lock-key lock-icon"></i></div>
    </button>

    <button class="menu-btn locked" data-menu="pertanyaan-esensial" id="btn-pertanyaan-esensial" disabled>
        <div class="menu-icon"><i class="ph ph-lightbulb"></i></div>
        <span class="menu-text">Pertanyaan Esensial</span>
        <div class="menu-status"><i class="ph ph-lock-key lock-icon"></i></div>
    </button>

    <button class="menu-btn locked" data-menu="eksplorasi-konsep" id="btn-eksplorasi-konsep" disabled>
        <div class="menu-icon"><i class="ph ph-monitor-play"></i></div>
        <span class="menu-text">Eksplorasi Konsep</span>
        <div class="menu-status"><i class="ph ph-lock-key lock-icon"></i></div>
    </button>

    <button class="menu-btn locked" data-menu="for-learning" id="btn-for-learning" disabled>

        <div class="menu-status"><i class="ph ph-lock-key lock-icon"></i></div>
    </button>

    <button class="menu-btn locked" data-menu="penerapan-konsep" id="btn-penerapan-konsep" disabled>
        <div class="menu-icon"><i class="ph ph-laptop"></i></div>
        <span class="menu-text">Penerapan Konsep</span>
        <div class="menu-status"><i class="ph ph-lock-key lock-icon"></i></div>
    </button>

    <button class="menu-btn locked" data-menu="as-learning" id="btn-as-learning" disabled>
        <div class="menu-icon"><i class="ph ph-brain"></i></div>

<!-- Letakkan ini tepat di bawah nav, ini area untuk memunculkan materi -->
<div id="dynamic-content-area" class="content-area">
    <!-- Konten JSON akan dimuat di sini -->
</div>
    // 2. FUNGSI UNTUK MEMUAT DAN MENAMPILKAN DATA
    async function muatDataMateri() {
        try {
            // Mengambil data dari file JSON kamu
            const response = await fetch('materi.json');
// Tambahkan pengecekan ini: jika statusnya bukan OK (misal 404), hentikan dan lempar error
if (!response.ok) {
    throw new Error(`Gagal memuat file JSON! Status: ${response.status}`);
}
const dataSemuaMateri = await response.json();
            
            // Mengambil ID dari URL (misal: website.com/index.html?id=kelas7-sem1-bab1-pertemuan1)
            const currentId = new URLSearchParams(window.location.search).get('id');
            const dataMateri = dataSemuaMateri[currentId];

            if (!dataMateri) {
                alert("Materi tidak ditemukan!");
                return;
            }

            // Memperbarui teks Judul Bab dan Pertemuan di HTML kamu
            // Pastikan kamu punya elemen dengan id 'judul-bab' dan 'pertemuan-info' di HTML-mu
            document.getElementById('judul-bab').innerText = dataMateri.judul_bab;
            document.getElementById('pertemuan-info').innerText = dataMateri.judul_pertemuan;

            // 3. MEMBANGUN STRUKTUR MENU
            // Di sinilah keajaibannya terjadi! Kita memasukkan data JSON ke dalam fungsi komponen.
            // Parameter seperti 'dataMateri.konten.atp' adalah data yang akan diproses oleh komponen-menu.js
            let learningMenus = [
                { 
                    id: "atp", 
                    title: "ATP", 
                    icon: "ph-target", 
                    btnText: "SELESAI DIBACA", 
                    html: buatKomponenATP(dataMateri.konten.atp) 
                },
                { 
                    id: "asesmen-awal", 
                    title: "ASESMEN AWAL", 
                    icon: "ph-clipboard-text", 
                    btnText: "KIRIM JAWABAN", 
                    html: buatKomponenAsesmenAwal(dataMateri.konten["asesmen-awal"]) 
                },
                { 
                    id: "pertanyaan-esensial", 
                    title: "PERTANYAAN ESENSIAL", 
                    icon: "ph-lightbulb", 
                    btnText: "SIMPAN JAWABAN", 
                    html: buatKomponenPertanyaanEsensial(dataMateri.konten["pertanyaan-esensial"]) 
                },
                { 
                    id: "eksplorasi-konsep", 
                    title: "EKSPLORASI KONSEP", 
                    icon: "ph-compass", 
                    btnText: "SELESAI BACA SLIDE", 
                    html: buatKomponenEksplorasiKonsep(dataMateri.konten["eksplorasi-konsep"]) 
                },
                { 
                    id: "for-learning", 
                    title: "FOR LEARNING", 
                    icon: "ph-pencil-simple", 
                    btnText: "CEK HASIL KUIS", 
                    html: buatKomponenForLearning(dataMateri.konten["for-learning"]) 
                },
                { 
                    id: "penerapan-konsep", 
                    title: "PENERAPAN KONSEP", 
                    icon: "ph-hammer", 
                    btnText: "KUMPULKAN TUGAS", 
                    html: buatKomponenPenerapanKonsep(dataMateri.konten["penerapan-konsep"]) 
                },
                { 
                    id: "as-learning", 
                    title: "AS LEARNING", 
                    icon: "ph-plant", 
                    btnText: "SIMPAN REFLEKSI", 
                    html: buatKomponenAsLearning(dataMateri.konten["as-learning"]) 
                }
            ];

            // 4. MENAMPILKAN KE LAYAR
            // Ini berasumsi kamu sudah punya fungsi ini dari kode sebelumnya
            // untuk mengatur tata letak tombol menu dan berpindah tab
            initContent(learningMenus);
            renderMenu(learningMenus);
            switchTab(learningMenus[0].id); // Langsung buka tab pertama (ATP) saat dimuat

        } catch (error) {
            console.error("Gagal memuat:", error);
        }
    }
// ==========================================
// FUNGSI-FUNGSI UNTUK MENCETAK MENU KE LAYAR
// ==========================================

// 1. Fungsi untuk menyiapkan wadah konten setiap menu
function initContent(menus) {
    const mainContent = document.getElementById('main-content');
    mainContent.innerHTML = ''; // Bersihkan area konten sebelum mengisinya
    
    menus.forEach(menu => {
        // Membuat kotak (div) baru untuk setiap menu
        const contentDiv = document.createElement('div');
        contentDiv.id = 'konten-' + menu.id;
        contentDiv.style.display = 'none'; // Sembunyikan semuanya di awal
        contentDiv.innerHTML = menu.html;  // Masukkan data HTML dari JSON kamu
        
        mainContent.appendChild(contentDiv);
    });
}

// 2. Fungsi untuk membuat tombol-tombol 7 menu
function renderMenu(menus) {
    const menuContainer = document.getElementById('menu-container');
    menuContainer.innerHTML = ''; // Bersihkan wadah menu sebelum mengisinya
    
    menus.forEach(menu => {
        // Membuat elemen tombol untuk setiap menu
        const button = document.createElement('button');
        button.className = 'menu-btn'; // Pastikan kamu punya pengaturan CSS untuk class ini agar rapi
        button.id = 'tombol-' + menu.id;
        button.innerText = menu.title; // Memberi nama tombol sesuai data (misal: "ATP")
        
        // Memberikan perintah: jika tombol diklik, jalankan fungsi switchTab
        button.onclick = function() {
            switchTab(menu.id);
        };
        
        menuContainer.appendChild(button);
    });
}

// 3. Fungsi untuk mengatur perpindahan saat menu diklik
function switchTab(menuIdPilihan) {
    // A. Sembunyikan semua konten terlebih dahulu
    const semuaKonten = document.getElementById('main-content').children;
    for (let i = 0; i < semuaKonten.length; i++) {
        semuaKonten[i].style.display = 'none';
    }
    
    // B. Tampilkan HANYA konten dari menu yang sedang dipilih
    document.getElementById('konten-' + menuIdPilihan).style.display = 'block';
    
    // C. (Opsional) Mengatur tampilan tombol yang sedang aktif agar berbeda warna
    const semuaTombol = document.getElementById('menu-container').children;
    for (let i = 0; i < semuaTombol.length; i++) {
        semuaTombol[i].classList.remove('aktif'); // Hapus tanda aktif dari semua tombol
    }
    document.getElementById('tombol-' + menuIdPilihan).classList.add('aktif'); // Beri tanda aktif ke tombol pilihan
}
    
    // Jalankan fungsi saat halaman web selesai dimuat
    window.onload = muatDataMateri;
</script>

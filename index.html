<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Fun! - Dashboard Pembelajaran Interaktif</title>

    <!-- Panggil script pengecekan login dan komponen ATP -->
    <script src="cek-login.js"></script>
    <script src="komponen-atp.js"></script>
    
    <!-- Memuat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Ikon Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Memuat File CSS Eksternal -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <!-- WADAH LOGIN -->
    <div id="login-container">
        <!-- ... [Struktur form login tetap tidak berubah] ... -->
        <div class="login-card">
            <div class="header-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
                </svg>
            </div>
    
            <h1 class="login-title">LOGIN</h1>
            <p class="login-desc">Silakan masuk untuk melanjutkan pembelajaran Informatika.</p>
    
            <div class="role-selector">
                <div class="role-option">
                    <input type="radio" id="roleSiswa" name="userRole" value="siswa" checked>
                    <label for="roleSiswa" class="role-label">Siswa</label>
                </div>
                <div class="role-option">
                    <input type="radio" id="roleGuru" name="userRole" value="guru">
                    <label for="roleGuru" class="role-label">Guru</label>
                </div>
            </div>
    
            <form id="loginForm">
                <div id="siswaSection" class="form-section active">
                    <div class="input-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" class="input-field" placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="input-group">
                        <label for="nisn">NISN</label>
                        <input type="text" id="nisn" class="input-field" placeholder="Masukkan NISN" inputmode="numeric">
                    </div>
                </div>
    
                <div id="guruSection" class="form-section">
                    <div class="input-group">
                        <label for="email">Email Guru</label>
                        <input type="email" id="email" class="input-field" placeholder="Masukkan email guru">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="Masukkan password">
                    </div>
                </div>
    
                <button type="submit" id="btnLogin" class="btn-login-submit">LOGIN</button>
                <div id="statusMessage" class="status-message"></div>
            </form>
    
            <div class="card-footer">
                <p class="footer-title">INFORMATIKA FUN</p>
                <p class="footer-desc">By: Riski Amalia, S.Pd</p>
            </div>
        </div>
    </div>

    <!-- WADAH DASHBOARD -->
    <div id="dashboard-container" class="hidden">
        <header class="top-header">
            <div class="logo-area">
                <i class="ph-fill ph-code-block logo-icon"></i>
                <div>
                    <h1>INFORMATIKA FUN!</h1>
                    <p class="tagline">Pembelajaran Interaktif & Menyenangkan</p>
                </div>
            </div>
            <div class="user-profile">
                <div class="user-info">
                    <span class="status-dot"></span>
                    <span id="user-name" class="user-name">Siswa</span>
                </div>
                <button id="btnLogout" class="btn-profile" title="Keluar / Ganti Akun" style="color: #e63946;">
                    <i class="ph ph-sign-out"></i>
                </button>
            </div>
        </header>

        <section class="page-title-section">
            <div class="page-title-content">
                <div class="badge-jp"><i class="ph ph-clock"></i> JP: 120 MENIT</div>
                <h2 class="chapter-title">BAB I: Konsep dan Analisis Data Terstruktur</h2>
                <h3 class="meeting-title">Pertemuan 1: Data Terstruktur vs. Tidak Terstruktur</h3>
            </div>
            <i class="ph-duotone ph-database hero-icon"></i>
        </section>

        <nav class="nav-container">
            <div id="menu-row" class="menu-row"></div>
        </nav>

        <main class="main-content-area">
            <div id="content-container"></div>
        </main>
    </div>

    <!-- LOGIKA JAVASCRIPT & FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7bt1JBOXkh81nYk8sVkuFpSmuJ3kOj94",
            authDomain: "databasemateriinformatika.firebaseapp.com",
            projectId: "databasemateriinformatika",
            storageBucket: "databasemateriinformatika.firebasestorage.app",
            messagingSenderId: "961327810612",
            appId: "1:961327810612:web:48e952f20159a5b932e261",
            measurementId: "G-TDZQZ9L36B"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const learningMenus = [
            { id: "atp", title: "ATP", icon: "ph-target", type: "read" },
            { id: "asesmen-awal", title: "ASESMEN AWAL", icon: "ph-clipboard-text", type: "task" },
            { id: "pertanyaan-esensial", title: "PERTANYAAN ESENSIAL", icon: "ph-question", type: "read" },
            { id: "eksplorasi-konsep", title: "EKSPLORASI KONSEP", icon: "ph-folders", type: "read" },
            { id: "for-learning", title: "FOR LEARNING", icon: "ph-lightbulb", type: "task" },
            { id: "penerapan-konsep", title: "PENERAPAN KONSEP", icon: "ph-wrench", type: "task" },
            { id: "as-learning", title: "AS LEARNING", icon: "ph-brain", type: "task" }
        ];

        let currentUser = localStorage.getItem('infoFun_Nama');
        let currentNISN = localStorage.getItem('infoFun_NISN');
        let storageKey = currentNISN ? `progress_Informatika_${currentNISN}` : '';
        let userProgress = {};

        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const userNameDisplay = document.getElementById('user-name');
        const loginForm = document.getElementById('loginForm');
        const statusDiv = document.getElementById('statusMessage');
        const btnLogin = document.getElementById('btnLogin');

        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            element.appendChild(circle);
        }

        function updateButtonVisuals(btn, menu, status) {
            btn.classList.remove("status-progress", "status-completed");
            let statusIcon = "ph-circle"; 
            if (status === "progress") { 
                btn.classList.add("status-progress"); 
                statusIcon = "ph-spinner-gap ph-spin"; 
            } else if (status === "completed") { 
                btn.classList.add("status-completed"); 
                statusIcon = "ph-check-circle"; 
            }
            btn.innerHTML = `<i class="ph-duotone ${menu.icon} menu-icon"></i> <span class="menu-title">${menu.title}</span> <i class="ph-bold ${statusIcon} status-indicator"></i>`;
        }

        function saveProgress(menuId, status) {
            userProgress[menuId] = status;
            localStorage.setItem(storageKey, JSON.stringify(userProgress));
        }

        const urlParams = new URLSearchParams(window.location.search);
        const pertemuanId = urlParams.get('id') || 'kelas7-sem1-bab1-pertemuan1'; 

        async function mulaiAplikasi() {
            userProgress = JSON.parse(localStorage.getItem(storageKey)) || {};
            const menuContainer = document.getElementById("menu-row");
            const contentContainer = document.getElementById("content-container");
            
            if (!menuContainer || !contentContainer) return;

            menuContainer.innerHTML = "";
            contentContainer.innerHTML = "";

            try {
                const response = await fetch('materi.json');
                const databaseMateri = await response.json();
                
                const materiSaatIni = databaseMateri[pertemuanId];

                if (!materiSaatIni) {
                    contentContainer.innerHTML = "<h3>Materi tidak ditemukan! Pastikan file materi.json sudah benar.</h3>";
                    return;
                }

                document.querySelector('.chapter-title').textContent = materiSaatIni.judul_bab;
                document.querySelector('.meeting-title').textContent = materiSaatIni.judul_pertemuan;

                learningMenus.forEach((menu) => {
                    const currentStatus = userProgress[menu.id] || "unstarted";

                    const btn = document.createElement("button");
                    btn.id = `btn-${menu.id}`;
                    btn.className = "tab-button";
                    btn.dataset.target = menu.id;
                    updateButtonVisuals(btn, menu, currentStatus);

                    btn.addEventListener("click", function(e) { createRipple(e, this); });

                    const pane = document.createElement("div");
                    pane.id = `pane-${menu.id}`;
                    pane.className = "tab-pane";
                    let actionButtonText = menu.type === "read" ? "Tandai Selesai Dibaca" : "Kirim Jawaban Tugas";
                    
                    let isiKonten = materiSaatIni.konten[menu.id] || `<p style="margin-top: 12px; color: #555;">Materi belum tersedia.</p>`;

                    // ========================================================
                    // LOGIKA REDESAIN KHUSUS MENU ATP (SEKARANG SANGAT RAPI!)
                    // ========================================================
                    if (menu.id === 'atp' && materiSaatIni.konten[menu.id]) {
                        // Memanggil fungsi eksternal dari komponen-atp.js
                        isiKonten = buatDesainATP(materiSaatIni.konten[menu.id]);
                    }
                    // ========================================================

                    // Logika untuk menyembunyikan ikon & judul default khusus di menu ATP
                    let headerBawaan = '';
                    if (menu.id !== 'atp') {
                        headerBawaan = `
                            <i class="ph-duotone ${menu.icon}" style="font-size: 3rem; color: var(--denim-blue); margin-bottom: 12px; display: inline-block;"></i>
                            <h2>${menu.title}</h2>
                        `;
                    }

                    // Logika untuk mengubah teks tombol yang sudah selesai
                    let teksSelesai = menu.type === "read" ? "Selesai Dibaca" : "Selesai Dikerjakan";

                    pane.innerHTML = `
                        <div class="content-card">
                            ${headerBawaan}
                            
                            <div class="materi-content" style="margin-top: ${menu.id === 'atp' ? '0' : '20px'}; text-align: left;">
                                ${isiKonten}
                            </div>

                            <br>
                            <button id="action-${menu.id}" class="btn-action ${currentStatus === 'completed' ? 'success' : ''}">
                                <i class="ph-bold ${currentStatus === 'completed' ? 'ph-check' : 'ph-paper-plane-right'}"></i> 
                                <span class="btn-text">${currentStatus === 'completed' ? teksSelesai : actionButtonText}</span>
                            </button>
                        </div>
                    `;

                    btn.addEventListener("click", () => {
                        document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active-tab"));
                        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
                        btn.classList.add("active-tab");
                        document.getElementById(`pane-${menu.id}`).classList.add("active");

                        if ((userProgress[menu.id] || "unstarted") === "unstarted") {
                            saveProgress(menu.id, "progress");
                            updateButtonVisuals(btn, menu, "progress");
                        }
                    });

                    menuContainer.appendChild(btn);
                    contentContainer.appendChild(pane);

                    const actionBtn = document.getElementById(`action-${menu.id}`);
                    if(actionBtn) {
                        actionBtn.addEventListener("click", async function(e) {
                            createRipple(e, this);
                            
                            if(this.classList.contains("success")) return;
                            
                            const btnText = this.querySelector('.btn-text');
                            const originalText = btnText.innerText;
                            btnText.innerText = "Mengirim...";

                            try {
                                await addDoc(collection(db, "pengumpulan_tugas"), {
                                    namaSiswa: currentUser,
                                    nisnSiswa: currentNISN,
                                    menuDikerjakan: menu.title,
                                    waktuPengumpulan: serverTimestamp()
                                });

                                this.classList.add("success");
                                this.innerHTML = `<i class="ph-bold ph-check"></i> <span class="btn-text">Tersimpan di Database!</span>`;
                                
                                saveProgress(menu.id, "completed");
                                updateButtonVisuals(btn, menu, "completed");

                            } catch (error) {
                                console.error("Error menambah dokumen: ", error);
                                alert("Gagal mengirim tugas: " + error.message);
                                btnText.innerText = originalText; 
                            }
                        });
                    }
                });

                const firstButton = document.getElementById(`btn-${learningMenus[0].id}`);
                if (firstButton) firstButton.click();

            } catch (error) {
                console.error("Gagal memuat materi:", error);
                contentContainer.innerHTML = "<h3>Terjadi kesalahan saat memuat materi. Pastikan kamu menjalankan file ini dengan Live Server.</h3>";
            }
        }

        if (currentUser && currentNISN) {
            loginContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
            userNameDisplay.textContent = currentUser;
            mulaiAplikasi();
        }

        const roleInputs = document.querySelectorAll('input[name="userRole"]');
        const siswaSection = document.getElementById('siswaSection');
        const guruSection = document.getElementById('guruSection');

        function showStatus(message, type) {
            statusDiv.innerText = message;
            statusDiv.style.display = 'block';
            statusDiv.className = type === 'error' ? 'status-message status-error' : 'status-message status-success';
        }

        roleInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                statusDiv.style.display = 'none';
                if (e.target.value === 'siswa') {
                    siswaSection.classList.add('active');
                    guruSection.classList.remove('active');
                } else {
                    guruSection.classList.add('active');
                    siswaSection.classList.remove('active');
                }
            });
        });

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); 
            
            const selectedRole = document.querySelector('input[name="userRole"]:checked').value;

            if (selectedRole === 'siswa') {
                const namaInput = document.getElementById('nama').value.trim();
                const nisnInput = document.getElementById('nisn').value.trim();

                if (namaInput === '' || nisnInput === '') {
                    showStatus('Nama dan NISN wajib diisi.', 'error');
                    return;
                }

                btnLogin.innerText = "Memeriksa...";
                showStatus('Memeriksa data siswa ke database...', 'success');

                try {
                    let docs = [];
                    const nisnStr = nisnInput;
                    const nisnNum = Number(nisnInput);

                    let q1 = query(collection(db, "siswa"), where("NISN", "==", nisnStr));
                    let snap1 = await getDocs(q1);
                    snap1.forEach(d => docs.push(d.data()));

                    if (docs.length === 0 && !isNaN(nisnNum)) {
                        let q2 = query(collection(db, "siswa"), where("NISN", "==", nisnNum));
                        let snap2 = await getDocs(q2);
                        snap2.forEach(d => docs.push(d.data()));
                    }

                    if (docs.length === 0) {
                        let q3 = query(collection(db, "siswa"), where("nisn", "==", nisnStr));
                        let snap3 = await getDocs(q3);
                        snap3.forEach(d => docs.push(d.data()));
                    }

                    if (docs.length === 0 && !isNaN(nisnNum)) {
                        let q4 = query(collection(db, "siswa"), where("nisn", "==", nisnNum));
                        let snap4 = await getDocs(q4);
                        snap4.forEach(d => docs.push(d.data()));
                    }

                    if (docs.length === 0) {
                        btnLogin.innerText = "LOGIN";
                        showStatus('NISN "' + nisnInput + '" tidak terdaftar di database.', 'error');
                        return;
                    }

                    let siswaCocok = false;
                    let namaDiDatabase = "";

                    docs.forEach((data) => {
                        for (let kolom in data) {
                            let namaKolomBersih = kolom.trim().toLowerCase().replace(/_/g, "");
                            if (namaKolomBersih.includes("nama")) {
                                let isiNamaDatabase = data[kolom];
                                if (typeof isiNamaDatabase === "string") {
                                    namaDiDatabase = isiNamaDatabase;
                                    if (isiNamaDatabase.trim().toLowerCase() === namaInput.toLowerCase()) {
                                        siswaCocok = true;
                                        break; 
                                    }
                                }
                            }
                        }
                    });

                    if (siswaCocok) {
                        showStatus('Login berhasil! Membuka materi...', 'success');
                        
                        localStorage.setItem('infoFun_Nama', namaInput);
                        localStorage.setItem('infoFun_NISN', nisnInput);
                        currentUser = namaInput;
                        currentNISN = nisnInput;
                        storageKey = `progress_Informatika_${currentNISN}`;
                        userNameDisplay.textContent = currentUser;

                        setTimeout(() => {
                            loginContainer.classList.add('hidden');
                            dashboardContainer.classList.remove('hidden');
                            mulaiAplikasi();
                        }, 500);
                        
                    } else {
                        btnLogin.innerText = "LOGIN";
                        showStatus('Nama "' + namaInput + '" tidak cocok dengan NISN tersebut. (Nama terdaftar: ' + (namaDiDatabase || "tidak ditemukan") + ')', 'error');
                    }

                } catch (error) {
                    console.error("Error Database:", error);
                    btnLogin.innerText = "LOGIN";
                    showStatus('Kendala Firebase: ' + error.message, 'error');
                }

            } else {
                const emailInput = document.getElementById('email').value.trim();
                const passwordInput = document.getElementById('password').value;

                if (emailInput === '' || passwordInput === '') {
                    showStatus('Email dan password belum diisi.', 'error');
                    return;
                }
                btnLogin.innerText = "Memeriksa...";
                showStatus('Memeriksa akun Guru...', 'success');

                signInWithEmailAndPassword(auth, emailInput, passwordInput)
                .then(() => {
                    showStatus('Login Guru berhasil! Mengalihkan...', 'success');
                    setTimeout(() => {
                        window.location.href = "https://riski902-alt.github.io/TOMBOL-PILIH-KELAS/"; 
                    }, 1000);
                })
                .catch((error) => {
                    btnLogin.innerText = "LOGIN";
                    showStatus('Login Guru gagal: ' + error.message, 'error');
                });
            }
        });

        const btnLogout = document.getElementById('btnLogout');
        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                const konfirmasi = confirm("Apakah kamu yakin ingin keluar dan mengganti akun?");
                if (konfirmasi) {
                    localStorage.removeItem('infoFun_Nama');
                    localStorage.removeItem('infoFun_NISN');
                    
                    dashboardContainer.classList.add('hidden');
                    loginContainer.classList.remove('hidden');
                    
                    document.getElementById('nama').value = '';
                    document.getElementById('nisn').value = '';
                    document.getElementById('statusMessage').style.display = 'none';
                    btnLogin.innerText = "LOGIN";
                }
            });
        }
    </script>
</body>
</html>

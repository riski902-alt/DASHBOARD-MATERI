<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFORMATIKA FUN! - Ruang Belajar</title>
    
    <!-- Import Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="menu-handler.js"></script>
      
    <!-- TAMBAHKAN BARIS INI UNTUK MEMANGGIL FILE style.css -->
    <link rel="stylesheet" href="style.css">
        
    <style>
        :root {
            --bg-main: #4A7298;        
            --box-bg: #1E3A5F;         
            --box-border: #88D4AB;     
            --box-hover: #23436b;      
            --text-main: #ffffff;      
            --soft-gold: #D8BD7B;
            --muted-blue-gray: #B5C2D0;
            --soft-green: #88D4AB;
            --status-red: #E57373;
            --font-title: 'Space Grotesk', sans-serif;
            --font-nav: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; padding-bottom: 50px; overflow-x: hidden; }

        /* HEADER & PROGRES */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: var(--box-bg); border-bottom: 3px solid var(--box-border); }
        .brand { font-family: var(--font-title); font-weight: 700; color: var(--soft-green); font-size: 1.4rem; display: flex; align-items: center; gap: 16px; }
        .brand-logo { height: 48px; width: 48px; object-fit: contain; }
        .user-profile { font-family: var(--font-nav); font-size: 0.9rem; color: var(--soft-gold); display: flex; align-items: center; gap: 8px;}

        /* TOMBOL LOGOUT */
        .logout-btn {
            background-color: transparent;
            color: var(--status-red);
            border: 1px solid var(--status-red);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--font-nav);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 8px;
            display: none;
        }
        .logout-btn:hover { background-color: var(--status-red); color: var(--text-main); }

        .header-section { padding: 30px 5% 10px 5%; display: flex; flex-direction: column; gap: 15px; }
        .title-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 10px 20px; }
        .title-header-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .page-title { font-family: var(--font-title); font-size: 1.8rem; margin-bottom: 0; flex: 1; line-height: 1.2; }
        .jp-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ffffff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); }
        
        .meeting-info { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .meeting-badge { display: inline-block; background-color: var(--soft-gold); color: var(--box-bg); padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); width: fit-content; }
        .meeting-desc { font-size: 0.95rem; color: var(--muted-blue-gray); margin: 0; }
        
        .progress-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 12px; padding: 8px 15px; }
        .progress-title { display: block; font-family: var(--font-title); font-size: 0.7rem; color: var(--soft-gold); font-weight: bold; margin-bottom: 2px; }
        .progress-stats { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 5px; font-family: var(--font-nav); }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; }
        .progress-bar-fill { height: 100%; background: var(--soft-green); width: 0%; transition: width 0.5s ease; }

        /* NAVIGASI */
        .nav-wrapper { padding: 0 5%; margin-top: 15px; }
        .nav-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding-bottom: 15px; }
        .nav-container::-webkit-scrollbar { height: 6px; }
        .nav-container::-webkit-scrollbar-thumb { background: var(--soft-green); border-radius: 10px; }
        
        .menu-btn { flex: 1; min-width: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background-color: #152C5B; border: 1px solid var(--box-border); border-radius: 8px; color: var(--text-main); cursor: pointer; }
        .menu-btn.locked { background-color: rgba(30, 58, 95, 0.5); border-color: rgba(136, 212, 171, 0.2); color: rgba(255,255,255,0.4); cursor: not-allowed; }
        .learning-menu-container { display: flex; width: 100%; gap: 15px; overflow-x: auto; margin-top: 15px; }

        /* KONTEN (TABS) */
        .content-area { padding: 20px 5% 30px 5%; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand">
            <img src="https://cdn.phototourl.com/member/2026-10-20-301bf8f0-f5cd-4de0-a3fd-b9b3a2d0e3e0.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            INFORMATIKA FUN!
        </div>
        <div class="user-profile">
            <span id="user-name-display">Memuat nama...</span>
            <i class="ph-fill ph-user-circle" style="font-size: 1.5rem;"></i>
            <button id="logout-btn" class="logout-btn">Keluar</button>
        </div>
    </header>

    <section class="header-section">
        <div class="title-box">
            <div class="title-header-row">
                <h1 class="page-title" id="judul-bab">Bab 1: Berpikir Komputasional</h1>
                <div class="jp-badge">JP: 120 MENIT</div>
            </div>
            <div class="meeting-info">
                <span class="meeting-badge" id="pertemuan-info">Pertemuan 1</span>
            </div>
            
            <div class="progress-box">
                <span class="progress-title">PROGRES PEMBELAJARAN</span>
                <span id="progress-text" class="progress-stats">0 dari 7 menu selesai (0%)</span>
                <div class="progress-bar-bg"><div id="progress-fill" class="progress-bar-fill"></div></div>
            </div>

            <!-- KOTAK MENU -->
            <nav class="learning-menu-container">
                <button class="menu-btn" onclick="switchTab('atp')" id="btn-atp">
                    <div class="menu-icon"><i class="ph ph-list-checks"></i></div>
                    <span class="menu-text">ATP</span>
                </button>

                <button class="menu-btn" onclick="switchTab('asesmen-awal')" id="btn-asesmen-awal">
                    <div class="menu-icon"><i class="ph ph-clipboard-text"></i></div>
                    <span class="menu-text">Asesmen Awal</span>
                </button>

                <button class="menu-btn" onclick="switchTab('pertanyaan-esensial')" id="btn-pertanyaan-esensial">
                    <div class="menu-icon"><i class="ph ph-lightbulb"></i></div>
                    <span class="menu-text">Pertanyaan Esensial</span>
                </button>

                <button class="menu-btn" onclick="switchTab('eksplorasi-konsep')" id="btn-eksplorasi-konsep">
                    <div class="menu-icon"><i class="ph ph-monitor-play"></i></div>
                    <span class="menu-text">Eksplorasi Konsep</span>
                </button>

                <button class="menu-btn" onclick="switchTab('for-learning')" id="btn-for-learning">
                    <div class="menu-icon"><i class="ph ph-target"></i></div>
                    <span class="menu-text">For Learning</span>
                </button>

                <button class="menu-btn" onclick="switchTab('penerapan-konsep')" id="btn-penerapan-konsep">
                    <div class="menu-icon"><i class="ph ph-laptop"></i></div>
                    <span class="menu-text">Penerapan Konsep</span>
                </button>

                <button class="menu-btn" onclick="switchTab('as-learning')" id="btn-as-learning">
                    <div class="menu-icon"><i class="ph ph-brain"></i></div>
                    <span class="menu-text">As Learning</span>
                </button>
            </nav>
        </div>
    </section>

    <!-- AREA UNTUK MEMUNCULKAN MATERI -->
    <div id="dynamic-content-area" class="content-area">
        <!-- Konten JSON akan dimuat di sini oleh JavaScript -->
    </div>

    <!-- SCRIPT UTAMA -->
    <script type="module">
        import {
            buatKomponenATP,
            buatKomponenAsesmenAwal,
            buatKomponenPertanyaanEsensial,
            buatKomponenEksplorasiKonsep,
            buatKomponenForLearning,
            buatKomponenPenerapanKonsep,
            buatKomponenAsLearning
        } from './komponen-menu.js';

        async function muatDataMateri() {
            try {
                const response = await fetch('materi.json');
                if (!response.ok) throw new Error(`Gagal memuat: ${response.status}`);
                const dataSemuaMateri = await response.json();
                
                // Ambil ID dari URL, jika kosong gunakan default
                const urlParams = new URLSearchParams(window.location.search);
                const currentId = urlParams.get('id') || Object.keys(dataSemuaMateri)[0]; 
                const dataMateri = dataSemuaMateri[currentId];

                if (!dataMateri) {
                    console.error("Materi tidak ditemukan!");
                    return;
                }

                // Ganti Teks Judul
                document.getElementById('judul-bab').innerText = dataMateri.judul_bab;
                document.getElementById('pertemuan-info').innerText = dataMateri.judul_pertemuan;

                // Membangun Struktur Menu dengan JSON
                let learningMenus = [
                    { id: "atp", html: buatKomponenATP(dataMateri.konten.atp) },
                    { id: "asesmen-awal", html: buatKomponenAsesmenAwal(dataMateri.konten["asesmen-awal"]) },
                    { id: "pertanyaan-esensial", html: buatKomponenPertanyaanEsensial(dataMateri.konten["pertanyaan-esensial"]) },
                    { id: "eksplorasi-konsep", html: buatKomponenEksplorasiKonsep(dataMateri.konten["eksplorasi-konsep"]) },
                    { id: "for-learning", html: buatKomponenForLearning(dataMateri.konten["for-learning"]) },
                    { id: "penerapan-konsep", html: buatKomponenPenerapanKonsep(dataMateri.konten["penerapan-konsep"]) },
                    { id: "as-learning", html: buatKomponenAsLearning(dataMateri.konten["as-learning"]) }
                ];

                // Menjalankan fungsi penyiapan konten
                initContent(learningMenus);
                
                // Langsung buka tab pertama (ATP) secara otomatis
                window.switchTab('atp');

            } catch (error) {
                console.error("Terjadi kesalahan:", error);
            }
        } 

        // Fungsi untuk memasukkan konten HTML ke dalam wadah layar
        function initContent(menus) {
            const mainContent = document.getElementById('dynamic-content-area');
            mainContent.innerHTML = ''; 
            
            menus.forEach(menu => {
                const contentDiv = document.createElement('div');
                contentDiv.id = 'konten-' + menu.id;
                contentDiv.style.display = 'none'; 
                contentDiv.innerHTML = menu.html;  
                mainContent.appendChild(contentDiv);
            });
        }

        // Fungsi agar switchTab bisa dipanggil oleh tombol HTML
        window.switchTab = function(menuIdPilihan) {
            const mainContent = document.getElementById('dynamic-content-area');
            if (!mainContent) return;
            
            // Sembunyikan semua materi
            const semuaKonten = mainContent.children;
            for (let i = 0; i < semuaKonten.length; i++) {
                semuaKonten[i].style.display = 'none';
            }
            
            // Tampilkan materi pilihan
            const kontenPilihan = document.getElementById('konten-' + menuIdPilihan);
            if (kontenPilihan) kontenPilihan.style.display = 'block';
        };

        // Jalankan fungsi memuat materi
        muatDataMateri();
    </script>
</body>
</html>

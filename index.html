<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Materi - INFORMATIKA FUN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="komponen-atp.js"></script>
</head>
<body>

    <!-- ========================================== -->
    <!-- WADAH LOGIN                                -->
    <!-- ========================================== -->
    <div id="login-container">
        <div class="login-card">
            <div class="header-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
                </svg>
            </div>

            <h1 class="login-title">LOGIN</h1>
            <p class="login-desc">Silakan masuk untuk melanjutkan pembelajaran Informatika.</p>

            <div class="role-selector">
                <div class="role-option">
                    <input type="radio" id="roleSiswa" name="userRole" value="siswa">
                    <label for="roleSiswa" class="role-label">Siswa</label>
                </div>
                <div class="role-option">
                    <input type="radio" id="roleGuru" name="userRole" value="guru" checked>
                    <label for="roleGuru" class="role-label">Guru</label>
                </div>
            </div>

            <form id="loginForm">
                <div id="siswaSection" class="form-section">
                    <div class="input-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" class="input-field" placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="input-group">
                        <label for="nisn">NISN</label>
                        <input type="text" id="nisn" class="input-field" placeholder="Masukkan NISN" inputmode="numeric">
                    </div>
                </div>

                <div id="guruSection" class="form-section active">
                    <div class="input-group">
                        <label for="email">Email Guru</label>
                        <input type="email" id="email" class="input-field" placeholder="Masukkan email guru">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="Masukkan password">
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn-login-submit">LOGIN</button>
                <div id="statusMessage" class="status-message"></div>
            </form>

            <div class="card-footer">
                <p class="footer-title">INFORMATIKA FUN</p>
                <p class="footer-desc">By: Riski Amalia, S.Pd</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- WADAH DASHBOARD MATERI                     -->
    <!-- ========================================== -->
    <div id="dashboard-container" class="hidden">
        
        <!-- Tambahan: Tombol Navigasi Kelas -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
            <button id="btn-kelas7" class="btn-action" style="background-color: #1a73e8; color: white;">Materi Kelas 7</button>
            <button id="btn-kelas8" class="btn-action" style="background-color: #1a73e8; color: white;">Materi Kelas 8</button>
            <button id="btn-kelas9" class="btn-action" style="background-color: #1a73e8; color: white;">Materi Kelas 9</button>
        </div>

        <div class="page-title-section">
            <div class="page-title-content">
                <h1 id="tempat-judul-bab" class="chapter-title">Memuat Bab...</h1>
                <h2 id="tempat-judul-pertemuan" class="meeting-title">Memuat Pertemuan...</h2>
            </div>
        </div>

        <div class="main-content-area">
            <div class="content-card">
                <div id="tempat-isi-materi" class="materi-content">
                    <p>Sedang mengambil data materi, mohon tunggu sebentar...</p>
                </div>
            </div>
            <button onclick="location.reload()" class="btn-action" style="background-color: #dc3545; color: white; margin-top: 20px;">Keluar / Kembali</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPT FIREBASE & LOGIKA APLIKASI          -->
    <!-- ========================================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
      import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB7bt1JBOXkh81nYk8sVkuFpSmuJ3kOj94",
        authDomain: "databasemateriinformatika.firebaseapp.com",
        projectId: "databasemateriinformatika",
        storageBucket: "databasemateriinformatika.firebasestorage.app",
        messagingSenderId: "961327810612",
        appId: "1:961327810612:web:48e952f20159a5b932e261",
        measurementId: "G-TDZQZ9L36B"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const roleInputs = document.querySelectorAll('input[name="userRole"]');
      const siswaSection = document.getElementById('siswaSection');
      const guruSection = document.getElementById('guruSection');
      const statusDiv = document.getElementById('statusMessage');
      const btnLogin = document.getElementById('btnLogin');

      const loginContainer = document.getElementById('login-container');
      const dashboardContainer = document.getElementById('dashboard-container');

      function showStatus(message, type) {
        if (!statusDiv) return;
        statusDiv.innerText = message;
        statusDiv.style.display = 'block';
        statusDiv.className = type === 'error' ? 'status-message status-error' : 'status-message status-success';
      }

      function hideStatus() {
        if (statusDiv) statusDiv.style.display = 'none';
      }

      roleInputs.forEach(input => {
        input.addEventListener('change', (e) => {
          hideStatus();
          if (e.target.value === 'siswa') {
            siswaSection.classList.add('active');
            guruSection.classList.remove('active');
          } else {
            guruSection.classList.add('active');
            siswaSection.classList.remove('active');
          }
        });
      });

      // =======================================================
      // FUNGSI UNTUK MENGAMBIL MATERI SECARA DINAMIS
      // =======================================================
      // Kita menambahkan 'kunciMateri' ke dalam tanda kurung
      async function tampilkanMateri(kunciMateri) {
          try {
              document.getElementById('tempat-isi-materi').innerHTML = "<p>Sedang memuat materi, mohon tunggu...</p>";
              
              const respon = await fetch('materi.json');
              const dataMaster = await respon.json();
              
              // Mengambil data berdasarkan kunci yang dikirim oleh tombol
              const materiPilihan = dataMaster[kunciMateri];

              if (materiPilihan) {
                  document.getElementById('tempat-judul-bab').innerText = materiPilihan.judul_bab;
                  document.getElementById('tempat-judul-pertemuan').innerText = materiPilihan.judul_pertemuan;
                  
                  const wadahIsiMateri = document.getElementById('tempat-isi-materi');
                  wadahIsiMateri.innerHTML = ''; 

                  const semuaKonten = materiPilihan.konten;
                  
                  for (let namaMenu in semuaKonten) {
                      let isiMenu = semuaKonten[namaMenu];
                      
                      let divBagian = document.createElement('div');
                      divBagian.style.marginBottom = "30px"; 
                      
                      let judulBagian = namaMenu.toUpperCase();
                      
                      let htmlKonten = `
                          <h3 class="section-title" style="color: #1a73e8; margin-bottom: 12px; font-weight: 700;">
                              📝 ${judulBagian}
                          </h3>
                          <div class="${namaMenu}-wrapper" style="background: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #e0e0e0;">
                              ${isiMenu}
                          </div>
                      `;
                      
                      divBagian.innerHTML = htmlKonten;
                      wadahIsiMateri.appendChild(divBagian);
                  }
              } else {
                  document.getElementById('tempat-isi-materi').innerHTML = "<p class='status-error'>Materi untuk kelas ini belum tersedia di JSON.</p>";
              }
          } catch (error) {
              console.error("Gagal mengambil materi:", error);
              document.getElementById('tempat-isi-materi').innerHTML = "<p class='status-error'>Terjadi kesalahan saat memuat file materi.json.</p>";
          }
      }

      // =======================================================
      // EVENT LISTENER UNTUK TOMBOL NAVIGASI KELAS
      // =======================================================
      // Perhatikan kunci (key) di bawah ini, pastikan ejaannya sama persis dengan yang ada di file materi.json kamu
      document.getElementById('btn-kelas7').addEventListener('click', () => {
          tampilkanMateri("kelas7-sem1-bab1-pertemuan1");
      });
      
      document.getElementById('btn-kelas8').addEventListener('click', () => {
          // Ganti teks di bawah ini jika penamaan kunci di JSON kamu berbeda
          tampilkanMateri("kelas8-sem1-bab1-pertemuan1");
      });
      
      document.getElementById('btn-kelas9').addEventListener('click', () => {
          // Ganti teks di bawah ini jika penamaan kunci di JSON kamu berbeda
          tampilkanMateri("kelas9-sem1-bab1-pertemuan1");
      });

      // =======================================================
      // PROSES LOGIN DAN TRANSISI
      // =======================================================
      if (btnLogin) {
        btnLogin.addEventListener('click', async (event) => {
          event.preventDefault();
          const selectedRole = document.querySelector('input[name="userRole"]:checked').value;

          if (selectedRole === 'siswa') {
            const namaInput = document.getElementById('nama').value.trim();
            const nisnInput = document.getElementById('nisn').value.trim();

            if (namaInput === '' || nisnInput === '') {
              showStatus('Nama dan NISN wajib diisi.', 'error');
              return;
            }

            showStatus('Memeriksa data siswa...', 'success');

            try {
              let q = query(collection(db, "siswa"), where("NISN", "==", nisnInput));
              let querySnapshot = await getDocs(q);

              if (querySnapshot.empty) {
                const nisnAngka = Number(nisnInput);
                q = query(collection(db, "siswa"), where("NISN", "==", nisnAngka));
                querySnapshot = await getDocs(q);
              }

              if (querySnapshot.empty) {
                showStatus('NISN tidak terdaftar di database.', 'error');
                return;
              }

              let siswaCocok = false;
              querySnapshot.forEach((doc) => {
                const data = doc.data();
                for (let kolom in data) {
                  let namaKolomBersih = kolom.trim().toLowerCase().replace(/_/g, "");
                  if (namaKolomBersih.includes("nama")) {
                    let isiNamaDatabase = data[kolom];
                    if (typeof isiNamaDatabase === "string" && isiNamaDatabase.trim().toLowerCase() === namaInput.toLowerCase()) {
                      siswaCocok = true;
                      break; 
                    }
                  }
                }
              });

              if (siswaCocok) {
                localStorage.setItem('infoFun_Nama', namaInput);
                localStorage.setItem('infoFun_NISN', nisnInput);

                showStatus('Login Siswa berhasil! Membuka materi...', 'success');
                
                setTimeout(() => {
                  loginContainer.classList.add('hidden');
                  dashboardContainer.classList.remove('hidden');
                  // Memuat materi kelas 7 secara default ketika baru login
                  tampilkanMateri("kelas7-sem1-bab1-pertemuan1"); 
                }, 800);
                
              } else {
                showStatus('Nama tidak cocok dengan NISN yang terdaftar.', 'error');
              }

            } catch (error) {
              console.error("Error Database:", error);
              showStatus('Terjadi kesalahan koneksi database.', 'error');
            }

          } else { 
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;

            if (emailInput === '' || passwordInput === '') {
              showStatus('Email dan password belum diisi.', 'error');
              return;
            }

            showStatus('Memeriksa akun Guru...', 'success');

            signInWithEmailAndPassword(auth, emailInput, passwordInput)
              .then(() => {
                localStorage.setItem('infoFun_Nama', 'AksesGuru');
                localStorage.setItem('infoFun_NISN', 'AksesGuru');

                showStatus('Login Guru berhasil! Membuka materi...', 'success');
                
                setTimeout(() => {
                  loginContainer.classList.add('hidden');
                  dashboardContainer.classList.remove('hidden');
                  // Memuat materi kelas 7 secara default ketika baru login
                  tampilkanMateri("kelas7-sem1-bab1-pertemuan1"); 
                }, 800);
              })
              .catch(() => {
                showStatus('Email atau password guru salah.', 'error');
              });
          }
        });
      }
    </script>
</body>
</html>

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .brand { font-family: var(--font-title); font-weight: 700; color: var(--soft-green); font-size: 1.4rem; display: flex; align-items: center; gap: 16px; }

        .user-profile { font-family: var(--font-nav); font-size: 0.9rem; color: var(--soft-gold); display: flex; align-items: center; gap: 8px;}

        /* TOMBOL LOGOUT */

        .logout-btn:hover { background-color: var(--status-red); color: var(--text-main); }

        .header-section { padding: 30px 5% 10px 5%; display: flex; flex-direction: column; gap: 15px; }
        .title-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 10px 20px; }
        .title-header-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .page-title { font-family: var(--font-title); font-size: 1.8rem; margin-bottom: 0; flex: 1; line-height: 1.2; }
        .jp-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ffffff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); }
        
        .meeting-info { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .meeting-badge { display: inline-block; background-color: var(--soft-gold); color: var(--box-bg); padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); width: fit-content; }
        
        .progress-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 12px; padding: 8px 15px; }
        .progress-title { display: block; font-family: var(--font-title); font-size: 0.7rem; color: var(--soft-gold); font-weight: bold; margin-bottom: 2px; }
        .progress-stats { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 5px; font-family: var(--font-nav); }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; }
        .progress-bar-fill { height: 100%; background: var(--soft-green); width: 0%; transition: width 0.5s ease; }

        /* NAVIGASI 7 MENU */
        .learning-menu-container { display: flex; width: 100%; gap: 15px; overflow-x: auto; margin-top: 15px; }
        .menu-btn { flex: 1; min-width: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background-color: #152C5B; border: 1px solid var(--box-border); border-radius: 8px; color: var(--text-main); cursor: pointer; }
        .menu-btn.locked { background-color: rgba(30, 58, 95, 0.5); border-color: rgba(136, 212, 171, 0.2); color: rgba(255,255,255,0.4); cursor: not-allowed; }
        .menu-btn.completed { background-color: var(--soft-green); color: var(--box-bg); border-color: var(--soft-green); }

        /* AREA KONTEN MATERI */
        .content-area { padding: 20px 5% 30px 5%; }

    <!-- SKRIP UTAMA UNTUK MEMUAT JSON -->
    <script type="module">
        import {
            buatKomponenATP,
            buatKomponenAsesmenAwal,
            buatKomponenPertanyaanEsensial,
            buatKomponenEksplorasiKonsep,
            buatKomponenForLearning,
            buatKomponenPenerapanKonsep,
            buatKomponenAsLearning
        } from './komponen-menu.js';

        async function muatDataMateri() {
    try {
        const response = await fetch('materi.json');
        if (!response.ok) throw new Error(`Gagal memuat file JSON! Status: ${response.status}`);
        const dataSemuaMateri = await response.json();

        // 1. Mengambil ID dari URL
        const currentId = new URLSearchParams(window.location.search).get('id') || Object.keys(dataSemuaMateri)[0];
        const dataMateri = dataSemuaMateri[currentId];

        if (!dataMateri) {
            console.error("Materi tidak ditemukan!");
            return;
        }

        // 2. Memperbarui teks judul
        document.getElementById('judul-bab').innerText = dataMateri.judul_bab;
        document.getElementById('pertemuan-info').innerText = dataMateri.judul_pertemuan;

        // 3. KODE BARU: Mengatur tombol ATP agar dinamis
        const tombolATP = document.getElementById('btn-atp');
        if (tombolATP) {
            // Saat tombol diklik, buka modal menggunakan ID materi yang sedang aktif
            tombolATP.onclick = () => {
                bukaModalATP(currentId);
            };
        }

    } catch (error) {
        console.error("Terjadi kesalahan saat memuat materi:", error);
    }
}

        muatDataMateri();
    </script>

   <!-- SKRIP FIREBASE & PROGRES -->
<script>
    // 1. KONFIGURASI FIREBASE (Pastikan data ini sesuai dengan milik Anda)
    const firebaseConfig = {
        apiKey: "API_KEY_ANDA",
        authDomain: "PROJECT_ID.firebaseapp.com",
        databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "PROJECT_ID",
        storageBucket: "PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };
    
    // Inisialisasi Firebase jika belum ada
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    document.addEventListener("DOMContentLoaded", function() {
        const totalMenus = 7;
        const progressText = document.getElementById("progress-text");
        const progressFill = document.getElementById("progress-fill");
        
        // Ambil ID User
        const userId = localStorage.getItem("currentUserId") || "siswa_dummy_01"; 
        const dbRef = database.ref('users/' + userId + '/progres_bab3'); // Pastikan ini bab yang benar
        const localKey = `progresBelajar_${userId}_bab3`; // Key khusus per bab

        // Variabel untuk menyimpan daftar menu yang sudah selesai
        let completedMenus = JSON.parse(localStorage.getItem(localKey)) || [];

        // 2. FUNGSI UNTUK MEMPERBARUI TAMPILAN PROGRES
        function updateProgressUI(completedMenusArray) {
            // Hilangkan duplikat ID jika ada
            const uniqueCompleted = [...new Set(completedMenusArray)];
            const completedCount = uniqueCompleted.length;
            
            // Hitung persentase (maksimal 100%)
            let percentage = Math.round((completedCount / totalMenus) * 100);
            if (percentage > 100) percentage = 100;

            // Update teks dan lebar bar progres di HTML
            if (progressText) {
                progressText.innerText = `${completedCount} dari ${totalMenus} menu selesai (${percentage}%)`;
            }
            if (progressFill) {
                progressFill.style.width = `${percentage}%`;
            }

            // Update warna tombol menu
            uniqueCompleted.forEach(menuId => {
                const btn = document.getElementById(menuId);
                if(btn) {
                    btn.classList.add("completed");
                    btn.classList.remove("locked");
                    const statusIcon = btn.querySelector('.menu-status i');
                    if(statusIcon) {
                        statusIcon.className = 'ph ph-check-circle';
                    }
                }
            });
        }

        // Tampilkan progres awal saat halaman dimuat
        updateProgressUI(completedMenus);

        // 3. SINKRONISASI DARI FIREBASE (Real-time listener)
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const completedFromDb = Object.keys(data);
                completedMenus = completedFromDb; // Sinkronkan array lokal dengan database
                localStorage.setItem(localKey, JSON.stringify(completedMenus));
                updateProgressUI(completedMenus);
            }
        });

        // 4. FUNGSI GLOBAL UNTUK MENANDAI SELESAI
        window.tandaiMenuSelesai = function(menuId) {
            // A. Update UI Instan (Optimistic UI) agar pengguna langsung melihat perubahan
            if (!completedMenus.includes(menuId)) {
                completedMenus.push(menuId);
                localStorage.setItem(localKey, JSON.stringify(completedMenus));
                updateProgressUI(completedMenus);
            }

            // B. Simpan ke Firebase di latar belakang
            dbRef.child(menuId).set(true)
            .then(() => {
                console.log(`${menuId} berhasil disimpan ke Firebase!`);
            })
            .catch((error) => {
                console.error("Gagal menyimpan ke Firebase:", error);
            });
        };
    });
</script>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFORMATIKA FUN! - Ruang Belajar</title>
    
    <!-- Import Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-main: #4A7298;        
            --box-bg: #1E3A5F;         
            --box-border: #88D4AB;     
            --box-hover: #23436b;      
            --text-main: #ffffff;      
            --soft-gold: #D8BD7B;
            --muted-blue-gray: #B5C2D0;
            --soft-green: #88D4AB;
            --status-red: #E57373;
            --font-title: 'Space Grotesk', sans-serif;
            --font-nav: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; padding-bottom: 50px; overflow-x: hidden; }

        /* HEADER & PROGRES */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: var(--box-bg); border-bottom: 3px solid var(--box-border); }
        .brand { font-family: var(--font-title); font-weight: 700; color: var(--soft-green); font-size: 1.4rem; display: flex; align-items: center; gap: 16px; }
        .brand-logo { height: 48px; width: 48px; object-fit: contain; }
        .user-profile { font-family: var(--font-nav); font-size: 0.9rem; color: var(--soft-gold); display: flex; align-items: center; gap: 8px;}

        /* TOMBOL LOGOUT */
        .logout-btn {
            background-color: transparent;
            color: var(--status-red);
            border: 1px solid var(--status-red);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--font-nav);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 8px;
            display: none;
        }
        .logout-btn:hover { background-color: var(--status-red); color: var(--text-main); }

        .header-section { padding: 30px 5% 10px 5%; display: flex; flex-direction: column; gap: 15px; }
        .title-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 15px 25px; }
        .title-header-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .page-title { font-family: var(--font-title); font-size: 2.2rem; margin-bottom: 0; flex: 1; line-height: 1.2; }
        .jp-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ffffff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); }
        
        .meeting-info { margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 8px; }
        .meeting-badge { display: inline-block; background-color: var(--soft-gold); color: var(--box-bg); padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; font-family: var(--font-nav); width: fit-content; }
        .meeting-desc { font-size: 0.95rem; color: var(--muted-blue-gray); margin: 0; }
        
        .progress-box { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 12px; padding: 12px 20px; }
        .progress-title { display: block; font-family: var(--font-title); font-size: 0.75rem; color: var(--soft-gold); font-weight: bold; margin-bottom: 2px; }
        .progress-stats { display: block; font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; font-family: var(--font-nav); }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; }
        .progress-bar-fill { height: 100%; background: var(--soft-green); width: 0%; transition: width 0.5s ease; }

        /* NAVIGASI */
        .nav-wrapper { padding: 0 5%; margin-top: 15px; }
        .nav-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding-bottom: 15px; }
        .nav-container::-webkit-scrollbar { height: 6px; }
        .nav-container::-webkit-scrollbar-thumb { background: var(--soft-green); border-radius: 10px; }
        
        .nav-btn { flex: 1; min-width: 180px; background-color: var(--box-bg); color: var(--text-main); border: 2px solid var(--box-border); padding: 12px 10px; border-radius: 30px; font-family: var(--font-nav); font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .nav-btn.active { background-color: var(--box-hover); border-color: #ffffff; }
        .nav-btn.active i { color: var(--soft-green); }
        .nav-btn.locked { background-color: rgba(30, 58, 95, 0.5); border-color: rgba(136, 212, 171, 0.2); color: rgba(255,255,255,0.4); cursor: not-allowed; }
        .nav-btn.completed { background-color: var(--soft-green); color: var(--box-bg); border-color: var(--soft-green); }
        .nav-btn.completed i { color: var(--box-bg); }

        /* KONTEN (TABS) */
        .content-area { padding: 20px 5% 30px 5%; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .bento-card { background-color: var(--box-bg); border: 2px solid var(--box-border); border-radius: 16px; padding: 30px; }
        .card-icon-wrapper { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background-color: rgba(136, 212, 171, 0.15); color: var(--soft-green); font-size: 26px; margin-bottom: 15px; }
        .bento-card.highlight { background-color: var(--soft-green); border-color: var(--text-main); color: var(--box-bg); }
        .bento-title { font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 12px; font-weight: 700; }

        /* TOMBOL AKSI */
        .action-button { align-self: flex-end; background-color: var(--soft-gold); color: var(--box-bg); border: none; padding: 12px 30px; border-radius: 8px; font-family: var(--font-nav); font-size: 1rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .action-button:disabled { background-color: #3b5a7a; color: #8bb3d4; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand">
            <img src="https://cdn.phototourl.com/member/2026-10-20-301bf8f0-f5cd-4de0-a3fd-b9b3a2d0e3e0.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            INFORMATIKA FUN!
        </div>
        <div class="user-profile">
            <span id="user-name-display">Memuat nama...</span>
            <i class="ph-fill ph-user-circle" style="font-size: 1.5rem;"></i>
            <button id="logout-btn" class="logout-btn">Keluar</button>
        </div>
    </header>

    <section class="header-section">
        <div class="title-box">
            <div class="title-header-row">
                <h1 class="page-title">Bab 1: Berpikir Komputasional</h1>
                <div class="jp-badge">JP: 120 MENIT</div>
            </div>
            <div class="meeting-info">
                <span class="meeting-badge">Pertemuan 1</span>
                <p class="meeting-desc">Pada pertemuan ini, kita akan mengeksplorasi langkah-langkah dasar berpikir komputasional untuk memecahkan masalah sistematis.</p>
            </div>
        </div>
        
        <div class="progress-box">
            <span class="progress-title">PROGRES PEMBELAJARAN</span>
            <span id="progress-text" class="progress-stats">0 dari 7 menu selesai (0%)</span>
            <div class="progress-bar-bg"><div id="progress-fill" class="progress-bar-fill"></div></div>
        </div>
    </section>

    <nav class="nav-wrapper"><div class="nav-container" id="menu-container"></div></nav>
    <main class="content-area" id="main-content"></main>

	<script type="module">
    // Import fungsi pembuat komponen yang tadi kita buat
    import { 
        buatKomponenATP, 
        buatKomponenAsesmenAwal, 
        buatKomponenPertanyaanEsensial,
        buatKomponenEksplorasiKonsep
    } from './komponen-menu.js';

    <script type="module">
        // 1. CEK LOGIN MELALUI LOCALSTORAGE (PERBAIKAN LANGKAH 3)
        const userRole = localStorage.getItem("userRole");
        const userName = localStorage.getItem("userName");

        // Jika bukan siswa dan bukan guru, paksa kembali ke halaman login
        if (userRole !== "siswa" && userRole !== "guru") {
            alert("Anda harus login terlebih dahulu untuk mengakses materi ini.");
            const currentId = new URLSearchParams(window.location.search).get('id');
            window.location.href = `../LOGIN-MATERI/index.html?redirect=${currentId}`;
        }

        // 2. TAMPILKAN PROFIL DAN TOMBOL LOGOUT
        const userNameDisplay = document.getElementById('user-name-display');
        const logoutBtn = document.getElementById('logout-btn');

        if (userRole === "siswa") {
            userNameDisplay.innerText = `Halo, ${userName}`;
            logoutBtn.style.display = 'inline-block';
        } else if (userRole === "guru") {
            userNameDisplay.innerText = `Halo, Guru`;
            logoutBtn.style.display = 'inline-block';
        }

        // Logika Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.clear(); // Hapus memori login jangka panjang
            window.location.href = "../LOGIN-MATERI/index.html"; // Arahkan kembali ke halaman login
        });

        // 3. IMPORT & KONFIGURASI FIREBASE (Dipertahankan untuk fitur simpan jawaban)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Ganti dengan kredensial Firebase asli milikmu
        const firebaseConfig = {
            apiKey: "AIzaSyYOUR_API_KEY_HERE",
            authDomain: "databasemateriinformatika.firebaseapp.com",
            projectId: "databasemateriinformatika",
            storageBucket: "databasemateriinformatika.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. STRUKTUR MENU KONTEN & APLIKASI (Kode Asli Anda)
        const learningMenus = [
            { id: "atp", title: "ATP", icon: "ph-target", btnText: "SELESAI DIBACA", 
              html: `<div class="bento-grid"><div class="bento-card highlight"><div class="card-icon-wrapper"><i class="ph-fill ph-flag-checkered"></i></div><h3 class="bento-title">Capaian Pembelajaran</h3><p>Siswa mampu memahami konsep dasar berpikir komputasional.</p></div></div>` },
            { id: "asesmen-awal", title: "ASESMEN AWAL", icon: "ph-clipboard-text", btnText: "KIRIM JAWABAN", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Kuis Diagnostik</h3><input type="text" placeholder="Ketik jawabanmu..." style="width:100%; padding:10px; border-radius:8px;"></div></div>` },
            { id: "pertanyaan-esensial", title: "PERTANYAAN ESENSIAL", icon: "ph-lightbulb", btnText: "KIRIM JAWABAN", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Pemantik</h3><p>Bagaimana cara komputer bekerja?</p></div></div>` },
            { id: "eksplorasi-konsep", title: "EKSPLORASI KONSEP", icon: "ph-compass", btnText: "SELESAI DIBACA", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Bahan Bacaan</h3><p>Silakan baca modul.</p></div></div>` },
            { id: "for-learning", title: "FOR LEARNING", icon: "ph-chats-circle", btnText: "KIRIM JAWABAN", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Diskusi</h3><textarea rows="3" style="width:100%; padding:10px; border-radius:8px;"></textarea></div></div>` },
            { id: "penerapan-konsep", title: "PENERAPAN KONSEP", icon: "ph-laptop", btnText: "KIRIM JAWABAN", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Praktek</h3><p>Praktek Scratch.</p></div></div>` },
            { id: "as-learning", title: "AS LEARNING", icon: "ph-brain", btnText: "KIRIM JAWABAN", 
              html: `<div class="bento-grid"><div class="bento-card"><h3 class="bento-title">Refleksi</h3><input type="text" style="width:100%; padding:10px; border-radius:8px;"></div></div>` }
        ];

        let userProgress = { "atp": 1, "asesmen-awal": 0, "pertanyaan-esensial": 0, "eksplorasi-konsep": 0, "for-learning": 0, "penerapan-konsep": 0, "as-learning": 0 };
        let currentActiveMenuId = "atp";

        const menuContainer = document.getElementById('menu-container');
        const mainContent = document.getElementById('main-content');
        
        function initContent() {
            mainContent.innerHTML = ''; 
            learningMenus.forEach(menu => {
                const section = document.createElement('div');
                section.className = `tab-content ${menu.id === currentActiveMenuId ? 'active' : ''}`;
                section.id = `content-${menu.id}`;
                section.innerHTML = menu.html;

                const actionBtn = document.createElement('button');
                actionBtn.className = 'action-button';
                actionBtn.id = `btn-${menu.id}`;
                actionBtn.innerHTML = `${menu.btnText}`;
                actionBtn.onclick = () => completeCurrentMenu(menu.id);
                
                section.appendChild(actionBtn);
                mainContent.appendChild(section);
            });
        }

        function renderMenu() {
            menuContainer.innerHTML = '';
            learningMenus.forEach(menu => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${menu.id === currentActiveMenuId ? 'active' : ''}`;
                
                if (userProgress[menu.id] === 0) {
                    btn.classList.add('locked');
                } else if (userProgress[menu.id] === 2) {
                    btn.classList.add('completed');
                }
                
                btn.innerHTML = `<i class="ph-fill ${menu.icon}"></i> <span>${menu.title}</span>`;
                btn.addEventListener('click', () => { if (userProgress[menu.id] !== 0) switchTab(menu.id); });
                menuContainer.appendChild(btn);
            });
            updateProgressUI();
        }

        function switchTab(menuId) {
            currentActiveMenuId = menuId;
            renderMenu();
            
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`content-${menuId}`).classList.add('active');
        }

        function completeCurrentMenu(menuId) {
            userProgress[menuId] = 2; 
            
            const actionBtn = document.getElementById(`btn-${menuId}`);
            actionBtn.innerHTML = `<i class="ph-fill ph-check"></i> SELESAI`;
            actionBtn.disabled = true;

            const currentIndex = learningMenus.findIndex(m => m.id === menuId);
            if (currentIndex < learningMenus.length - 1) {
                const nextMenuId = learningMenus[currentIndex + 1].id;
                if (userProgress[nextMenuId] === 0) userProgress[nextMenuId] = 1; 
                switchTab(nextMenuId); 
            } else {
                switchTab(menuId);
            }
        }

        function updateProgressUI() {
            const selesai = Object.values(userProgress).filter(v => v === 2).length;
            const total = learningMenus.length;
            const persentase = Math.round((selesai / total) * 100);
            document.getElementById('progress-text').innerText = `${selesai} dari ${total} menu selesai (${persentase}%)`;
            document.getElementById('progress-fill').style.width = `${persentase}%`;
        }

        initContent();
        renderMenu();
        switchTab(currentActiveMenuId);
    </script>
</body>
</html>
